<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EducaPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fbe8f0 0%, #f3e4f5 50%, #fce8db 100%);
        }

        /* Floating decoration shapes */
        .deco {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.45;
            animation: floatDeco 6s ease-in-out infinite;
        }
        .deco-1 { width: 180px; height: 180px; background: #f0a8bb; top: -40px; left: -60px; animation-delay: 0s; }
        .deco-2 { width: 120px; height: 120px; background: #c5afd8; bottom: 60px; right: -30px; animation-delay: 2s; }
        .deco-3 { width: 80px;  height: 80px;  background: #e8a98a; bottom: 200px; left: 30px; animation-delay: 4s; }
        .deco-4 { width: 60px;  height: 60px;  background: #a8d5c2; top: 120px; right: 80px; animation-delay: 1s; }
        .deco-5 { width: 100px; height: 100px; background: #f2c4ce; top: 300px; left: -20px; animation-delay: 3s; }

        @keyframes floatDeco {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50%       { transform: translateY(-18px) rotate(8deg); }
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .login-card {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(18px);
            border: 2px solid rgba(240,168,187,0.45);
            border-radius: 28px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 12px 48px rgba(212, 116, 142, 0.18);
        }

        .logo-area {
            margin-bottom: 28px;
        }

        .logo-emoji {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 8px;
            animation: bounceLogo 2s ease-in-out infinite;
        }
        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }

        .logo {
            font-family: 'Fredoka One', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 600;
        }

        .welcome-msg {
            font-family: 'Fredoka One', sans-serif;
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .welcome-desc {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 18px;
            background: #fdf5f8;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
        }

        input::placeholder {
            color: #c5a5b5;
            font-weight: 600;
        }

        input:focus {
            border-color: var(--primary-light);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(212, 116, 142, 0.12);
        }

        #errorMsg {
            background: #ffe8ed;
            border: 1.5px solid #f0a8bb;
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--primary);
            font-size: 0.82rem;
            margin-bottom: 14px;
            font-weight: 700;
            display: none;
        }

        .login-footer {
            margin-top: 22px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .login-footer a {
            color: var(--primary);
            font-weight: 800;
        }

        .login-footer a:hover {
            color: var(--primary-hover);
        }

        .divider {
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 24px 0;
        }
    </style>
</head>

<body>
    <!-- Floating decorative bubbles -->
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>
    <div class="deco deco-3"></div>
    <div class="deco deco-4"></div>
    <div class="deco deco-5"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <span class="logo-emoji">🎓</span>
                <div class="logo">EducaPlay</div>
                <div class="login-subtitle">Portal da Professora</div>
            </div>

            <div class="divider"></div>

            <h2 class="welcome-msg">Bem-vinda, Prof.! 🌸</h2>
            <p class="welcome-desc">Acesse sua biblioteca exclusiva de materiais.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">✉️ E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">🔒 Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <p id="errorMsg">❌ E-mail ou senha incorretos. Tente novamente.</p>
                <button type="submit" class="btn-primary">✨ ENTRAR AGORA</button>
            </form>

            <div class="login-footer">
                Problemas com o acesso? <a href="#">Falar com Suporte</a>
            </div>
        </div>
    </div>

    <script>
        const LOGIN_EMAIL = 'userprofessora569@acesso.com'; // Altere aqui
        const LOGIN_PASS = 'professoraportugues569'; // Altere aqui

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('errorMsg');

            if (email === LOGIN_EMAIL && pass === LOGIN_PASS) {
                window.location.href = 'dashboard.html';
            } else {
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 3000);
            }
        });
    </script>
</body>

</html>
